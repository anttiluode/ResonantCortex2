name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve committed receipt
        run: cp results/default.json /tmp/committed-receipt.json
      - name: Regenerate deterministic receipt
        run: node scripts/run-default.mjs
      - name: Run engineering tests
        run: node tests/run-tests.mjs
      - name: Verify committed receipt is reproducible
        run: node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(JSON.parse(fs.readFileSync('results/default.json','utf8')), JSON.parse(fs.readFileSync('/tmp/committed-receipt.json','utf8')));"
